name: Task
description: A technical task or spike that supports a story
labels: ["task"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
    validations:
      required: true
  - type: input
    id: story
    attributes:
      label: Parent story
      placeholder: "#12"
