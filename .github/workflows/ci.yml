name: CI

on:
  push:
    branches: [main, dev, "phase1/**", "sim/**", simulation, dashboard, firmware]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mujoco:
    name: MuJoCo simulation (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: simulation/mujoco
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: simulation/mujoco/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest gymnasium
      - name: Build the robot from the CAD and run the build checks
        run: python spider.py --save
      - name: Headless walk check (30 s)
        run: python walk.py --check
      - name: Tests
        run: ../../tools/ci_pytest.sh tests -v --durations=10

  cad:
    name: CAD extraction is reproducible
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: simulation/mujoco
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install numpy scipy pillow pytest olefile zstandard opencv-python-headless
      - name: Re-extract hardware/cad/inventor and compare
        run: ../../tools/ci_pytest.sh tests/test_cad_reproducible.py tests/test_step_reader.py -v

  pybullet:
    name: PyBullet simulation and environment
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: simulation/pybullet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install pybullet gymnasium numpy pytest
      - name: Tests
        run: ../../tools/ci_pytest.sh tests -v

  dashboard:
    name: Operator dashboard (SvelteKit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build

  lint:
    name: Python lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff (errors only)
        run: ruff check --output-format=github --select E9,F63,F7,F82 simulation tools
