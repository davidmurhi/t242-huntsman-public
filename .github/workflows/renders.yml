name: Renders

# Screenshots and a walking clip of Kai's PyBullet spider, made headless.
# Run it from the Actions tab (or by pushing tools/ changes on a phase
# branch); the images are attached to the run as an artifact.
on:
  workflow_dispatch:
  push:
    branches: ["phase1/**"]
    paths: ["tools/render_pybullet.py", ".github/workflows/renders.yml"]

permissions:
  contents: write

jobs:
  pybullet:
    name: PyBullet spider (Kai) screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pybullet numpy pillow
      - name: Walk the v6 gait headless and capture frames
        run: python tools/render_pybullet.py --out renders/pybullet
      - uses: actions/upload-artifact@v4
        with:
          name: pybullet-renders
          path: renders/pybullet
      - name: Publish to the renders branch (pushes only)
        if: github.event_name == 'push'
        run: |
          cd renders/pybullet
          git init -q -b renders
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "PyBullet renders"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" renders:ci/renders
