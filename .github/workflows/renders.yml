name: Renders

# Screenshots and a walking clip of Kai's PyBullet spider, made headless.
# Run it from the Actions tab; the images are attached to the run as an
# artifact (docs/media/pybullet holds the committed copies).
on:
  workflow_dispatch:

jobs:
  pybullet:
    name: PyBullet spider (Kai) screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pybullet numpy pillow
      - name: Walk the v6 gait headless and capture frames
        run: python tools/render_pybullet.py --out renders/pybullet
      - uses: actions/upload-artifact@v4
        with:
          name: pybullet-renders
          path: renders/pybullet
