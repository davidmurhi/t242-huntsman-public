<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300"><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="a0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9aa5b1"/></marker></defs><rect width="1100" height="300" rx="14" fill="#ffffff"/><text x="24.0" y="38.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Simulation pipeline: from V Source&#x27;s CAD to a trained policy</text><rect x="24" y="90" width="190" height="110" rx="10" fill="#f5f7fa" stroke="#be123c" stroke-width="2"/><rect x="24" y="90" width="6" height="110" rx="3" fill="#be123c"/><text x="42.0" y="116.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#be123c" text-anchor="start">Inventor CAD</text><text x="42.0" y="138.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">bot.iam, full leg.iam</text><text x="42.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">8 part files (.ipt)</text><rect x="236" y="90" width="190" height="110" rx="10" fill="#f5f7fa" stroke="#b45309" stroke-width="2"/><rect x="236" y="90" width="6" height="110" rx="3" fill="#b45309"/><text x="254.0" y="116.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="start">extract_cad.py</text><text x="254.0" y="138.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">reads Inventor directly</text><text x="254.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">shapes, joints, skins</text><line x1="214" y1="145" x2="234" y2="145" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><rect x="448" y="90" width="190" height="110" rx="10" fill="#f5f7fa" stroke="#0f766e" stroke-width="2"/><rect x="448" y="90" width="6" height="110" rx="3" fill="#0f766e"/><text x="466.0" y="116.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e" text-anchor="start">spider.py</text><text x="466.0" y="138.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">MuJoCo model</text><text x="466.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">masses = weight sheet</text><line x1="426" y1="145" x2="446" y2="145" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><rect x="660" y="90" width="190" height="110" rx="10" fill="#f5f7fa" stroke="#1d4ed8" stroke-width="2"/><rect x="660" y="90" width="6" height="110" rx="3" fill="#1d4ed8"/><text x="678.0" y="116.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">gait.py</text><text x="678.0" y="138.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">foot paths + IK</text><text x="678.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">4 gaits, heading hold</text><line x1="638" y1="145" x2="658" y2="145" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><rect x="872" y="90" width="190" height="110" rx="10" fill="#f5f7fa" stroke="#6d28d9" stroke-width="2"/><rect x="872" y="90" width="6" height="110" rx="3" fill="#6d28d9"/><text x="890.0" y="116.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="start">huntsman_env.py</text><text x="890.0" y="138.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">terrains, randomisation</text><text x="890.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">PPO (train.py)</text><line x1="850" y1="145" x2="870" y2="145" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><text x="24.0" y="240.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">CI re-runs the extraction and checks it reproduces the committed geometry, then builds the model and walks it headless on every push.</text></svg>
