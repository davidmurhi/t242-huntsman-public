<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="a0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9aa5b1"/></marker></defs><rect width="1100" height="330" rx="14" fill="#ffffff"/><text x="24.0" y="38.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Learning on rough ground: residual reinforcement learning</text><rect x="30" y="90" width="230" height="110" rx="10" fill="#f5f7fa" stroke="#1d4ed8" stroke-width="2"/><rect x="30" y="90" width="6" height="110" rx="3" fill="#1d4ed8"/><text x="48.0" y="116.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">Drive command</text><text x="48.0" y="138.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">speed, sideways, turn</text><text x="48.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">from operator / planner</text><rect x="330" y="70" width="250" height="80" rx="10" fill="#f5f7fa" stroke="#0f766e" stroke-width="2"/><rect x="330" y="70" width="6" height="80" rx="3" fill="#0f766e"/><text x="348.0" y="96.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e" text-anchor="start">Hand gait (gait.py)</text><text x="348.0" y="118.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">walks on flat ground</text><rect x="330" y="180" width="250" height="100" rx="10" fill="#f5f7fa" stroke="#6d28d9" stroke-width="2"/><rect x="330" y="180" width="6" height="100" rx="3" fill="#6d28d9"/><text x="348.0" y="206.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="start">Policy (PPO network)</text><text x="348.0" y="228.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">sees 86 numbers (IMU, joints)</text><text x="348.0" y="247.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">outputs +/-20 deg corrections</text><rect x="660" y="120" width="160" height="100" rx="10" fill="#f5f7fa" stroke="#b45309" stroke-width="2"/><rect x="660" y="120" width="6" height="100" rx="3" fill="#b45309"/><text x="678.0" y="146.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="start">Sum</text><text x="678.0" y="168.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">24 servo targets</text><rect x="890" y="90" width="180" height="160" rx="10" fill="#f5f7fa" stroke="#be123c" stroke-width="2"/><rect x="890" y="90" width="6" height="160" rx="3" fill="#be123c"/><text x="908.0" y="116.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#be123c" text-anchor="start">Robot / MuJoCo</text><text x="908.0" y="138.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">rubble, slope, steps</text><text x="908.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">random friction,</text><text x="908.0" y="176.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">payload, servo strength</text><text x="908.0" y="195.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">sensor noise</text><line x1="262" y1="130" x2="328" y2="110" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><line x1="262" y1="160" x2="328" y2="220" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><line x1="582" y1="110" x2="658" y2="150" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><line x1="582" y1="230" x2="658" y2="190" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><line x1="822" y1="170" x2="888" y2="170" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><line x1="980" y1="252" x2="455" y2="282" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1)"/><text x="717.5" y="293.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">observation + reward (speed tracking, heading, level, effort)</text></svg>
