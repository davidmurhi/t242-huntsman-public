<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="a0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9aa5b1"/></marker></defs><rect width="1100" height="520" rx="14" fill="#ffffff"/><text x="24.0" y="38.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">System architecture: one drive protocol from simulation to robot</text><text x="24.0" y="62.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">The simulation speaks the same WebSocket protocol the robot&#x27;s payload will, so the dashboard and the gait code move to hardware unchanged.</text><rect x="30" y="100" width="260" height="130" rx="10" fill="#f5f7fa" stroke="#1d4ed8" stroke-width="2"/><rect x="30" y="100" width="6" height="130" rx="3" fill="#1d4ed8"/><text x="48.0" y="126.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">Operator dashboard</text><text x="48.0" y="148.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">SvelteKit (Tom)</text><text x="48.0" y="167.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">drive pad, e-stop, gait mode</text><text x="48.0" y="186.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">roll / pitch / heading, battery</text><rect x="30" y="330" width="260" height="150" rx="10" fill="#f5f7fa" stroke="#6d28d9" stroke-width="2"/><rect x="30" y="330" width="6" height="150" rx="3" fill="#6d28d9"/><text x="48.0" y="356.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="start">Simulation (MuJoCo)</text><text x="48.0" y="378.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">built from V Source CAD</text><text x="48.0" y="397.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">controller.py: same server</text><text x="48.0" y="416.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">terrains + Gymnasium env</text><text x="48.0" y="435.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">PPO training</text><rect x="420" y="90" width="290" height="160" rx="10" fill="#f5f7fa" stroke="#0f766e" stroke-width="2"/><rect x="420" y="90" width="6" height="160" rx="3" fill="#0f766e"/><text x="438.0" y="116.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e" text-anchor="start">Raspberry Pi 5 - payload</text><text x="438.0" y="138.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">gait controller (gait.py)</text><text x="438.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">learned policy (PPO, residual)</text><text x="438.0" y="176.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">IMU heading hold, telemetry</text><text x="438.0" y="195.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">Python API, WebSocket server</text><rect x="420" y="340" width="290" height="130" rx="10" fill="#f5f7fa" stroke="#b45309" stroke-width="2"/><rect x="420" y="340" width="6" height="130" rx="3" fill="#b45309"/><text x="438.0" y="366.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="start">ESP32 - chassis</text><text x="438.0" y="388.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">receives 24 joint targets</text><text x="438.0" y="407.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">PWM via two driver banks</text><text x="438.0" y="426.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">(Prab: serial link proven)</text><rect x="830" y="340" width="240" height="130" rx="10" fill="#f5f7fa" stroke="#be123c" stroke-width="2"/><rect x="830" y="340" width="6" height="130" rx="3" fill="#be123c"/><text x="848.0" y="366.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#be123c" text-anchor="start">24 x DSC55MG servos</text><text x="848.0" y="388.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">8 legs x hip, knee, ankle</text><text x="848.0" y="407.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">18 V Makita LXT pack</text><text x="848.0" y="426.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">4.33 kg robot</text><rect x="830" y="90" width="240" height="160" rx="10" fill="#f5f7fa" stroke="#15803d" stroke-width="2"/><rect x="830" y="90" width="6" height="160" rx="3" fill="#15803d"/><text x="848.0" y="116.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">Sensors</text><text x="848.0" y="138.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">IMU (heading, tilt)</text><text x="848.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">servo positions</text><text x="848.0" y="176.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">Phase 2: payload sensors</text><text x="848.0" y="195.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">(V Source)</text><line x1="292" y1="165" x2="418" y2="165" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)" marker-start="url(#a0)"/><text x="355.0" y="157.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">WebSocket JSON</text><line x1="160" y1="232" x2="160" y2="328" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1)" marker-start="url(#a0)"/><text x="104.0" y="284.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">same protocol</text><line x1="292" y1="380" x2="418" y2="230" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><text x="407.0" y="327.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">trained policy</text><line x1="565" y1="252" x2="565" y2="338" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><text x="617.0" y="299.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">joint targets</text><line x1="712" y1="405" x2="828" y2="405" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><text x="770.0" y="397.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">PWM</text><line x1="828" y1="170" x2="712" y2="170" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a1)"/><text x="770.0" y="162.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">measurements</text></svg>
