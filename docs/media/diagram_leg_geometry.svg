<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Background -->
  <rect width="600" height="480" fill="#0f1117"/>

  <!-- Title -->
  <text x="300" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="1">LEG GEOMETRY — PROJECT HUNTSMAN</text>
  <text x="300" y="54" text-anchor="middle" font-size="11" fill="#64748b">Coxa · Femur · Tibia — dimensions from Craig's confirmed hardware specs</text>

  <!-- Hip joint origin -->
  <circle cx="120" cy="140" r="7" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="78" y="138" font-size="10" fill="#94a3b8">Hip (Z)</text>
  <text x="78" y="150" font-size="10" fill="#64748b">yaw axis</text>

  <!-- COXA segment: 80mm at 30° forward from hip -->
  <!-- 30° from vertical/horizontal: forward = cos30*80, down = sin30*80 -->
  <!-- Let's draw: from hip, coxa goes forward at 30° below horizontal -->
  <!-- cos30=0.866, sin30=0.5 → dx=69, dy=40 in SVG (scaled ×1.3) -->
  <line x1="120" y1="140" x2="209" y2="192" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <!-- Angle arc for coxa -->
  <path d="M 150 140 A 30 30 0 0 1 145 165" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <text x="152" y="155" font-size="10" fill="#f59e0b">30°</text>
  <!-- Coxa label -->
  <text x="153" y="163" font-size="12" font-weight="600" fill="#f59e0b">COXA</text>
  <text x="153" y="177" font-size="10" fill="#94a3b8">80 mm</text>

  <!-- Knee joint -->
  <circle cx="209" cy="192" r="6" fill="#ef4444" stroke="#f87171" stroke-width="1.5"/>
  <text x="218" y="192" font-size="10" fill="#94a3b8">Knee (X)</text>
  <text x="218" y="204" font-size="10" fill="#64748b">pitch axis</text>

  <!-- FEMUR segment: 140mm at 10° outward from knee -->
  <!-- Continuing downward at shallower angle: dx=sin10*140=24, dy=cos10*140=138 (scaled 0.9) -->
  <!-- dx=22, dy=124 -->
  <line x1="209" y1="192" x2="231" y2="316" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <!-- Angle arc for femur -->
  <path d="M 209 222 A 30 30 0 0 1 218 218" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <text x="225" y="232" font-size="10" fill="#3b82f6">10°</text>
  <!-- Femur label -->
  <text x="244" y="254" font-size="12" font-weight="600" fill="#3b82f6">FEMUR</text>
  <text x="244" y="268" font-size="10" fill="#94a3b8">140 mm</text>
  <text x="244" y="280" font-size="10" fill="#64748b">outward lean</text>

  <!-- Ankle joint -->
  <circle cx="231" cy="316" r="6" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <text x="242" y="316" font-size="10" fill="#94a3b8">Ankle (X)</text>
  <text x="242" y="328" font-size="10" fill="#64748b">pitch axis</text>

  <!-- TIBIA segment: 160mm at 16° inward from ankle -->
  <!-- Inward = back toward CoM: dx=-sin16*160=-44, dy=cos16*160=154 (scaled 0.9) -->
  <!-- dx=-40, dy=138 -->
  <line x1="231" y1="316" x2="191" y2="398" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
  <!-- Angle arc for tibia -->
  <path d="M 231 346 A 30 30 0 0 0 218 348" stroke="#a855f7" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <text x="195" y="355" font-size="10" fill="#a855f7">16°</text>
  <!-- Tibia label -->
  <text x="110" y="368" font-size="12" font-weight="600" fill="#a855f7">TIBIA</text>
  <text x="110" y="382" font-size="10" fill="#94a3b8">160 mm</text>
  <text x="110" y="394" font-size="10" fill="#64748b">inward — foot under CoM</text>

  <!-- Foot (sphere contact) -->
  <circle cx="191" cy="398" r="10" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="191" cy="398" r="3" fill="#34d399"/>
  <text x="208" y="402" font-size="10" fill="#34d399">foot r=30mm</text>
  <text x="208" y="414" font-size="10" fill="#64748b">μ=2.0</text>

  <!-- Ground line -->
  <line x1="60" y1="418" x2="380" y2="418" stroke="#334155" stroke-width="2"/>
  <text x="62" y="433" font-size="10" fill="#475569">ground (Z=0)</text>

  <!-- Vertical CoM drop line -->
  <line x1="120" y1="140" x2="120" y2="418" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="70" y="280" font-size="10" fill="#475569" transform="rotate(-90,70,280)">body height ~0.035m</text>

  <!-- CoM indicator -->
  <line x1="120" y1="418" x2="191" y2="418" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="145" y="437" font-size="10" fill="#f59e0b">foot under CoM</text>

  <!-- Right panel: stats -->
  <rect x="410" y="80" width="170" height="300" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="495" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">SEGMENT SPECS</text>

  <!-- Coxa row -->
  <rect x="422" y="116" width="8" height="40" rx="2" fill="#f59e0b"/>
  <text x="438" y="132" font-size="11" font-weight="600" fill="#f59e0b">Coxa</text>
  <text x="438" y="146" font-size="10" fill="#94a3b8">80 mm @ 30° fwd</text>
  <text x="438" y="158" font-size="10" fill="#64748b">hip yaw → knee</text>

  <!-- Femur row -->
  <rect x="422" y="168" width="8" height="48" rx="2" fill="#3b82f6"/>
  <text x="438" y="184" font-size="11" font-weight="600" fill="#3b82f6">Femur</text>
  <text x="438" y="198" font-size="10" fill="#94a3b8">140 mm @ 10° out</text>
  <text x="438" y="210" font-size="10" fill="#64748b">knee → ankle</text>
  <text x="438" y="222" font-size="10" fill="#64748b">wide stable stance</text>

  <!-- Tibia row -->
  <rect x="422" y="228" width="8" height="48" rx="2" fill="#a855f7"/>
  <text x="438" y="244" font-size="11" font-weight="600" fill="#a855f7">Tibia</text>
  <text x="438" y="258" font-size="10" fill="#94a3b8">160 mm @ 16° in</text>
  <text x="438" y="270" font-size="10" fill="#64748b">ankle → foot</text>
  <text x="438" y="282" font-size="10" fill="#64748b">inward for CoM align</text>

  <!-- DOF summary -->
  <line x1="422" y1="290" x2="568" y2="290" stroke="#334155" stroke-width="1"/>
  <text x="438" y="308" font-size="10" fill="#94a3b8">3 DOF per leg × 8 legs</text>
  <text x="438" y="322" font-size="10" fill="#e2e8f0" font-weight="600">= 24 servos total</text>
  <text x="438" y="340" font-size="10" fill="#64748b">MG90S @ 3S LiPo</text>
  <text x="438" y="354" font-size="10" fill="#64748b">kp: hip 40, knee 55, ankle 30</text>

  <!-- Bottom note -->
  <text x="300" y="465" text-anchor="middle" font-size="10" fill="#475569">All dimensions confirmed with Craig Schneider, V Source Development</text>
</svg>
