<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="700" height="440" fill="#0f1117"/>

  <text x="350" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="1">SYSTEM ARCHITECTURE — PROJECT HUNTSMAN</text>
  <text x="350" y="52" text-anchor="middle" font-size="11" fill="#64748b">Hardware · Software · Control Chain</text>

  <!-- ===================== LAYER LABELS ===================== -->
  <text x="16" y="100" font-size="10" fill="#475569" transform="rotate(-90,16,100)">OPERATOR</text>
  <text x="16" y="200" font-size="10" fill="#475569" transform="rotate(-90,16,200)">COMPUTE</text>
  <text x="16" y="320" font-size="10" fill="#475569" transform="rotate(-90,16,320)">CONTROL</text>
  <text x="16" y="400" font-size="10" fill="#475569" transform="rotate(-90,16,400)">ACTUATORS</text>

  <!-- ===================== OPERATOR LAYER ===================== -->
  <!-- Dashboard box -->
  <rect x="40" y="70" width="140" height="64" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6">Dashboard</text>
  <text x="110" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">SvelteKit UI</text>
  <text x="110" y="124" text-anchor="middle" font-size="10" fill="#64748b">Tom · frontend/</text>

  <!-- Research box -->
  <rect x="220" y="70" width="140" height="64" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="290" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#6366f1">RL Training</text>
  <text x="290" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">SB3 PPO · Gymnasium</text>
  <text x="290" y="124" text-anchor="middle" font-size="10" fill="#64748b">Kai · simulation/rl/</text>

  <!-- Simulation box -->
  <rect x="400" y="70" width="140" height="64" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="470" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">Simulation</text>
  <text x="470" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">MuJoCo MJCF + PyBullet</text>
  <text x="470" y="124" text-anchor="middle" font-size="10" fill="#64748b">David + Kai · simulation/</text>

  <!-- ===================== SEPARATOR ===================== -->
  <line x1="40" y1="150" x2="660" y2="150" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===================== COMPUTE LAYER ===================== -->
  <rect x="210" y="165" width="280" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">Raspberry Pi 5</text>
  <text x="350" y="210" text-anchor="middle" font-size="10" fill="#94a3b8">4-core Arm Cortex-A76 · 8GB RAM</text>
  <text x="350" y="226" text-anchor="middle" font-size="10" fill="#64748b">ML inference · policy execution · WebSocket → dashboard</text>
  <text x="350" y="240" text-anchor="middle" font-size="10" fill="#64748b">firmware/pi5/ · Prab</text>

  <!-- Arrows: operator → Pi5 -->
  <line x1="110" y1="134" x2="260" y2="165" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <line x1="290" y1="134" x2="320" y2="165" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-indigo)"/>
  <line x1="470" y1="134" x2="420" y2="165" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- ===================== SEPARATOR ===================== -->
  <line x1="40" y1="263" x2="660" y2="263" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===================== CONTROL LAYER ===================== -->
  <rect x="210" y="278" width="280" height="72" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="350" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#ef4444">ESP32</text>
  <text x="350" y="322" text-anchor="middle" font-size="10" fill="#94a3b8">Dual-core 240MHz · 24× PWM channels</text>
  <text x="350" y="338" text-anchor="middle" font-size="10" fill="#64748b">firmware/esp32/ · Prab</text>

  <!-- Arrow: Pi5 → ESP32 via UART -->
  <line x1="350" y1="245" x2="350" y2="278" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <rect x="358" y="256" width="46" height="16" rx="3" fill="#0f1117"/>
  <text x="381" y="268" text-anchor="middle" font-size="10" font-weight="600" fill="#f59e0b">UART</text>

  <!-- ===================== ACTUATORS LAYER ===================== -->
  <!-- 8 servo groups -->
  <!-- Hip yaw (Z) -->
  <rect x="40" y="372" width="90" height="48" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="85" y="393" text-anchor="middle" font-size="10" font-weight="700" fill="#a855f7">8× Hip</text>
  <text x="85" y="407" text-anchor="middle" font-size="10" fill="#94a3b8">yaw Z-axis</text>
  <text x="85" y="418" text-anchor="middle" font-size="9" fill="#64748b">kp = 40</text>

  <!-- Knee pitch -->
  <rect x="150" y="372" width="90" height="48" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="195" y="393" text-anchor="middle" font-size="10" font-weight="700" fill="#a855f7">8× Knee</text>
  <text x="195" y="407" text-anchor="middle" font-size="10" fill="#94a3b8">pitch X-axis</text>
  <text x="195" y="418" text-anchor="middle" font-size="9" fill="#64748b">kp = 55</text>

  <!-- Ankle pitch -->
  <rect x="260" y="372" width="90" height="48" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="305" y="393" text-anchor="middle" font-size="10" font-weight="700" fill="#a855f7">8× Ankle</text>
  <text x="305" y="407" text-anchor="middle" font-size="10" fill="#94a3b8">pitch X-axis</text>
  <text x="305" y="418" text-anchor="middle" font-size="9" fill="#64748b">kp = 30</text>

  <!-- Total -->
  <rect x="380" y="372" width="130" height="48" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="445" y="393" text-anchor="middle" font-size="11" font-weight="700" fill="#e2e8f0">24 MG90S Servos</text>
  <text x="445" y="407" text-anchor="middle" font-size="10" fill="#94a3b8">3S LiPo 2200mAh</text>
  <text x="445" y="418" text-anchor="middle" font-size="9" fill="#64748b">~20 min runtime</text>

  <!-- Power / Battery -->
  <rect x="530" y="372" width="130" height="48" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="595" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#f59e0b">3S LiPo</text>
  <text x="595" y="404" text-anchor="middle" font-size="10" fill="#94a3b8">11.1V · 2200mAh</text>
  <text x="595" y="418" text-anchor="middle" font-size="9" fill="#64748b">Pi5 + ESP32 + servos</text>

  <!-- Arrow: ESP32 → servos -->
  <line x1="280" y1="350" x2="195" y2="372" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="310" y1="350" x2="305" y2="372" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="340" y1="350" x2="380" y2="372" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <!-- PWM label -->
  <text x="350" y="366" text-anchor="middle" font-size="9" fill="#ef4444">24× PWM</text>

  <!-- Defs -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
