<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="700" height="360" fill="#0f1117"/>

  <text x="350" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="1">WAVE GAIT PATTERN — PROJECT HUNTSMAN</text>
  <text x="350" y="50" text-anchor="middle" font-size="11" fill="#64748b">1 leg swings at a time · 7 legs in stance · legs cycle in sequence</text>

  <!-- Column headers: time steps -->
  <text x="170" y="74" text-anchor="middle" font-size="10" fill="#475569">T=0</text>
  <text x="250" y="74" text-anchor="middle" font-size="10" fill="#475569">T=1</text>
  <text x="330" y="74" text-anchor="middle" font-size="10" fill="#475569">T=2</text>
  <text x="410" y="74" text-anchor="middle" font-size="10" fill="#475569">T=3</text>
  <text x="490" y="74" text-anchor="middle" font-size="10" fill="#475569">T=4</text>
  <text x="570" y="74" text-anchor="middle" font-size="10" fill="#475569">T=5</text>
  <text x="650" y="74" text-anchor="middle" font-size="10" fill="#475569">T=6</text>

  <!-- Vertical grid -->
  <line x1="130" y1="78" x2="130" y2="300" stroke="#1e293b" stroke-width="1"/>

  <!-- Leg rows -->
  <!-- Swing = orange/amber, Stance = blue -->
  <!-- Pattern: each leg swings for 1 step, offset by 1 step each -->

  <!-- Helper: stance rect -->
  <!-- L1 swings at T=0 -->
  <text x="120" y="100" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">L1</text>
  <rect x="140" y="84" width="60" height="24" rx="4" fill="#f59e0b" opacity="0.9"/>
  <text x="170" y="101" text-anchor="middle" font-size="9" font-weight="700" fill="#0f1117">SWING</text>
  <rect x="220" y="84" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="300" y="84" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="380" y="84" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="460" y="84" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="540" y="84" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="620" y="84" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>

  <!-- L2 swings at T=1 -->
  <text x="120" y="130" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">L2</text>
  <rect x="140" y="114" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="220" y="114" width="60" height="24" rx="4" fill="#f59e0b" opacity="0.9"/>
  <text x="250" y="131" text-anchor="middle" font-size="9" font-weight="700" fill="#0f1117">SWING</text>
  <rect x="300" y="114" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="380" y="114" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="460" y="114" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="540" y="114" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="620" y="114" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>

  <!-- L3 swings at T=2 -->
  <text x="120" y="160" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">L3</text>
  <rect x="140" y="144" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="220" y="144" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="300" y="144" width="60" height="24" rx="4" fill="#f59e0b" opacity="0.9"/>
  <text x="330" y="161" text-anchor="middle" font-size="9" font-weight="700" fill="#0f1117">SWING</text>
  <rect x="380" y="144" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="460" y="144" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="540" y="144" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="620" y="144" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>

  <!-- L4 swings at T=3 -->
  <text x="120" y="190" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">L4</text>
  <rect x="140" y="174" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="220" y="174" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="300" y="174" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="380" y="174" width="60" height="24" rx="4" fill="#f59e0b" opacity="0.9"/>
  <text x="410" y="191" text-anchor="middle" font-size="9" font-weight="700" fill="#0f1117">SWING</text>
  <rect x="460" y="174" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="540" y="174" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="620" y="174" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>

  <!-- L5 swings at T=4 -->
  <text x="120" y="220" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">L5</text>
  <rect x="140" y="204" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="220" y="204" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="300" y="204" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="380" y="204" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="460" y="204" width="60" height="24" rx="4" fill="#f59e0b" opacity="0.9"/>
  <text x="490" y="221" text-anchor="middle" font-size="9" font-weight="700" fill="#0f1117">SWING</text>
  <rect x="540" y="204" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="620" y="204" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>

  <!-- L6 swings at T=5 -->
  <text x="120" y="250" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">L6</text>
  <rect x="140" y="234" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="220" y="234" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="300" y="234" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="380" y="234" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="460" y="234" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="540" y="234" width="60" height="24" rx="4" fill="#f59e0b" opacity="0.9"/>
  <text x="570" y="251" text-anchor="middle" font-size="9" font-weight="700" fill="#0f1117">SWING</text>
  <rect x="620" y="234" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>

  <!-- L7 swings at T=6 -->
  <text x="120" y="280" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">L7</text>
  <rect x="140" y="264" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="220" y="264" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="300" y="264" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="380" y="264" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="460" y="264" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="540" y="264" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="620" y="264" width="60" height="24" rx="4" fill="#f59e0b" opacity="0.9"/>
  <text x="650" y="281" text-anchor="middle" font-size="9" font-weight="700" fill="#0f1117">SWING</text>

  <!-- L8 row: shown as stance all the way in this window (it would swing at T=7) -->
  <text x="120" y="310" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">L8</text>
  <rect x="140" y="294" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="220" y="294" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="300" y="294" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="380" y="294" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="460" y="294" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="540" y="294" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <rect x="620" y="294" width="60" height="24" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <text x="650" y="310" text-anchor="middle" font-size="8" fill="#475569">(T=7)</text>

  <!-- Legend -->
  <rect x="140" y="332" width="14" height="14" rx="3" fill="#f59e0b" opacity="0.9"/>
  <text x="160" y="344" font-size="11" fill="#94a3b8">Swing phase (foot lifted)</text>
  <rect x="340" y="332" width="14" height="14" rx="3" fill="#1d4ed8" opacity="0.8"/>
  <text x="360" y="344" font-size="11" fill="#94a3b8">Stance phase (foot grounded)</text>

  <!-- Stability note -->
  <text x="350" y="358" text-anchor="middle" font-size="10" fill="#475569">Minimum 7/8 feet grounded · contact ratio β = feet_grounded/8 · β target &gt; 0.8</text>
</svg>
